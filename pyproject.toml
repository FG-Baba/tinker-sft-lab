[project]
name = "tinker-sft-lab"
version = "0.1.0"
description = "Minimal, cost-guarded supervised fine-tuning CLI for Thinking Machines Tinker"
requires-python = ">=3.11"
dependencies = [
  "tinker>=0.23.0",
  "tinker-cookbook>=0.5.2",
]

[project.scripts]
tinker-lab = "tinker_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tinker_lab"]

[tool.coverage.run]
branch = true
source = ["tinker_lab"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
